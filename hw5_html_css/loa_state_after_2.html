<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>LOA – Another State (Capture)</title>
  <link rel="stylesheet" href="loa.css">
</head>
<body>
  <div class="container">
    <div class="title">Lines of Action — Another State (about to capture)</div>
    <div class="board" id="board"></div>
    <div class="footer">This page visualizes state_after_2 from logic/hw1.ml</div>
  </div>

  <script>
    // Matches logic/hw1.ml state_after_2
    const B='B', W='W', _='.';
    const board = [
      ['.', '.', 'B','B','B','B','B','.'],
      ['.', '.', 'W','.', '.', '.', '.', 'W'],
      ['W','B','.', '.', '.', '.', '.', 'W'],
      ['W','.', '.', '.', '.', '.', '.', 'W'],
      ['W','.', '.', '.', '.', '.', '.', 'W'],
      ['W','.', '.', '.', '.', '.', '.', 'W'],
      ['W','.', '.', '.', '.', '.', '.', 'W'],
      ['.', 'B','B','B','B','B','B','.'],
    ];
    const boardEl = document.getElementById('board');
    for (let r=0;r<8;r++) {
      for (let c=0;c<8;c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const v = board[r][c];
        if (v === 'B' || v === 'W') {
          const p = document.createElement('div');
          p.className = 'piece ' + (v === 'B' ? 'black' : 'white');
          cell.appendChild(p);
        }
        boardEl.appendChild(cell);
      }
    }
  </script>
</body>
</html>
